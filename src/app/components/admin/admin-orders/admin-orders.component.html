<div class="orders-container">
  <app-header [title]="'Administrador'"></app-header>

  <div class="content">
    <div class="orders-scroll" *ngIf="orders().length > 0">
      <div *ngFor="let order of orders()" class="order-card" [class]="getStatusClass(order.status)">
        <div class="order-items">
          <ul>
            <li *ngFor="let item of order.items">
              {{ item.quantity }} unidade<span *ngIf="item.quantity > 1">s</span> de {{ item.cupcake.name }}
            </li>
          </ul>
        </div>

        <div class="order-info">
          <p class="total">Total: R${{ order.total.toFixed(2) }} ({{ getPaymentMethodLabel(order.paymentMethod) }})</p>
          <p class="status" [class]="getStatusClass(order.status)">
            Status: {{ getStatusLabel(order.status) }}
          </p>
        </div>

        <div class="order-actions" *ngIf="order.status !== 'completed' && order.status !== 'cancelled'">
          <button 
            *ngIf="order.status === 'pending' || order.status === 'sent'"
            class="action-button sent" 
            (click)="markAsSent(order.id)">
            Marcar como {{ order.status === 'pending' ? 'enviado' : 'recebido' }}
          </button>
          <button 
            class="action-button cancel" 
            (click)="markAsCancelled(order.id)">
            Marcar como cancelado
          </button>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="orders().length === 0">
      <p>Nenhum pedido recebido ainda</p>
    </div>

    <button class="home-button" (click)="goHome()">
      Voltar para home
    </button>
  </div>
</div>
