<header class="header">
  <div class="logo">
    <span class="cupcake-icon">🧁</span>
  </div>
  <h2>{{ title }}</h2>
  <button 
    class="cart-button" 
    *ngIf="showCart && cartItemCount > 0"
    (click)="onCartClick()"
    title="Ver carrinho">
    <span class="cart-icon">🛒</span>
    <span class="badge">{{ cartItemCount }}</span>
  </button>
  <div class="spacer" *ngIf="!showCart || cartItemCount === 0"></div>
</header>
