<div class="home-container">
  <div class="content">
    <div class="hero-section">
      <div class="cupcake-emoji">🧁</div>
      <h1 class="title">Bem-vindo!</h1>
      <p class="subtitle">Deliciosos cupcakes feitos com amor</p>
    </div>

    <div class="menu-cards">
      <div class="menu-card orders-card" (click)="goToOrders()">
        <div class="card-icon">📦</div>
        <h3 class="card-title">Meus Pedidos</h3>
        <p class="card-description">Acompanhe seus pedidos</p>
        <div class="card-arrow">→</div>
      </div>

      <div class="menu-card catalog-card" (click)="goToCupcakes()">
        <div class="card-icon">🛍️</div>
        <h3 class="card-title">Catálogo</h3>
        <p class="card-description">Explore nossos cupcakes</p>
        <div class="card-arrow">→</div>
      </div>
    </div>

    <div class="footer-text">
      <p>Feito com 💖 para você</p>
    </div>
  </div>
</div>
