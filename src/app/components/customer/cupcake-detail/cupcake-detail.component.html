<div class="cupcake-detail-container" *ngIf="cupcake">
  <app-header 
    [showCart]="true" 
    [cartItemCount]="cartItemCount()"
    (cartClick)="goToCart()">
  </app-header>

  <div class="content">
    <div class="cupcake-display">
      <div class="cupcake-image">
        <img [src]="cupcake.image" [alt]="cupcake.name">
      </div>
      <div class="cupcake-info">
        <h3>{{ cupcake.name }}</h3>
        <p class="price">R$ {{ cupcake.price.toFixed(2) }}</p>
      </div>
    </div>

    <div class="quantity-section">
      <label>Quantidade:</label>
      <div class="quantity-control">
        <button class="quantity-btn" (click)="decreaseQuantity()" [disabled]="quantity <= 1">
          <span>−</span>
        </button>
        <span class="quantity-value">{{ quantity }}</span>
        <button class="quantity-btn" (click)="increaseQuantity()">
          <span>+</span>
        </button>
      </div>
    </div>

    <div class="total-section">
      <span class="total-label">Total:</span>
      <span class="total-price">R$ {{ getTotalPrice().toFixed(2) }}</span>
    </div>

    <button class="add-to-cart-button" (click)="addToCart()">
      Adicionar ao carrinho
    </button>
  </div>
</div>
