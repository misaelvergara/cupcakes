<div class="container">
  <h1>Cupcakes Gourmet</h1>
  
  <div class="phones-wrapper">
    <!-- Smartphone 1 - Customer View -->
    <div class="smartphone">
      <div class="phone-frame">
        <div class="screen">
          <div class="app-content">
            <router-outlet></router-outlet>
          </div>
        </div>
        <div class="android-nav-bar">
          <button 
            *ngIf="!isHomePage"
            class="nav-button back-button" 
            (click)="goBack()" 
            title="Voltar">
            ◀
          </button>
          <div *ngIf="isHomePage" class="nav-spacer"></div>
          <button class="nav-button home-button" (click)="goHome()" title="Home">

          </button>
          <button class="nav-button recent-button" title="Recentes">
            ▢
          </button>
        </div>
      </div>
    </div>

    <!-- Smartphone 2 - Admin View (To be implemented) -->
    <div class="smartphone">
      <div class="phone-frame">
        <div class="screen">
          <div class="app-content">
            <div class="placeholder">
              <h2>Admin View</h2>
              <p>Coming soon...</p>
            </div>
          </div>
        </div>
        <div class="android-nav-bar">
          <button class="nav-button back-button" title="Voltar">
            ◀
          </button>
          <button class="nav-button home-button" title="Home">
            ⚫
          </button>
          <button class="nav-button recent-button" title="Recentes">

        </div>
