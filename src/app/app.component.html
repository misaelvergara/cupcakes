<div class="container">
  <h1>Cupcakes Gourmet</h1>
  
  <div class="phones-wrapper">
    <!-- Smartphone 1 - Customer View -->
    <div class="smartphone">
      <div class="phone-frame">
        <div class="screen">
          <div class="app-content">
            <router-outlet></router-outlet>
          </div>
        </div>
        <div class="android-nav-bar">
          <button 
            *ngIf="!isCustomerHomePage"
            class="nav-button back-button" 
            (click)="goBackCustomer()" 
            title="Voltar">
            ◀
          </button>
          <div *ngIf="isCustomerHomePage" class="nav-spacer"></div>
          <button class="nav-button home-button" (click)="goHomeCustomer()" title="Home">
            ⚫
          </button>
          <button class="nav-button recent-button" title="Recentes">
            ▢
          </button>
        </div>
      </div>
    </div>

    <!-- Smartphone 2 - Admin View -->
    <div class="smartphone">
      <div class="phone-frame">
        <div class="screen">
          <div class="app-content">
            <app-home-admin 
              *ngIf="adminCurrentView === 'home'"
              (ordersClick)="navigateAdmin('orders')"
              (cupcakesClick)="navigateAdmin('cupcakes')">
            </app-home-admin>
            <app-admin-orders 
              *ngIf="adminCurrentView === 'orders'"
              (homeClick)="goHomeAdmin()">
            </app-admin-orders>
            <app-manage-cupcakes 
              *ngIf="adminCurrentView === 'cupcakes'"
              (homeClick)="goHomeAdmin()">
            </app-manage-cupcakes>
          </div>
        </div>
        <div class="android-nav-bar">
          <button 
            *ngIf="!isAdminHomePage"
            class="nav-button back-button" 
            (click)="goBackAdmin()" 
            title="Voltar">
            ◀
          </button>
          <div *ngIf="isAdminHomePage" class="nav-spacer"></div>
          <button class="nav-button home-button" (click)="goHomeAdmin()" title="Home">
            ⚫
          </button>
          <button class="nav-button recent-button" title="Recentes">
            ▢
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
